[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qingzi-learning-assistant"
version = "0.1.0"
description = "Windows desktop learning assistant"
requires-python = ">=3.11"
dependencies = [
    "opencv-python==4.13.0.92",
    "cv2-enumerate-cameras==1.3.3",
    "Pillow>=11,<13",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qingzi_learning.schema" = ["*.json"]
"qingzi_learning.storage" = ["*.sql"]
